<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=icon href=favicon.png><meta name=theme-color content="#f6f1e7"><meta property=og:site_name content="P.PATTERN"><meta property=og:image content="https://p-pattern.onrender.com/p/og.jpg"><meta name=twitter:card content=summary_large_image><link rel=preconnect href=https://fonts.gstatic.com><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel=stylesheet><link rel=stylesheet href=style.css><title>P.PATTERN</title><meta name=description content="The P Pattern: womenswear, bags and eyewear, made with love. Worldwide delivery. Order by DM."><meta property=og:title content="P.PATTERN"></head><body>
<div class=pdp id=d></div><section class=sec style="padding-top:20px"><span class=eyebrow>You may also like</span><h2>Complete the look</h2><div class=grid id=g></div></section>
<script src=catalog.js></script><script src=app.js></script><script>shell('pdp');
const p=PRODUCTS.find(x=>x.id==new URLSearchParams(location.search).get('id'))||PRODUCTS[0];document.title=p.name+' | P.PATTERN';
let st={color:p.colors[0]?p.colors[0][0]:'',size:'',img:0};
d.innerHTML=`<div class=gal><div class=th>${p.imgs.map((s,i)=>`<img src="${s}" data-i=${i} alt="">`).join('')}</div><div class=zoom id=z><img id=main src="${p.imgs[0]}" alt="${p.name}"></div></div>
<div class=info><div class=eyebrow style="color:#958a7e">${p.cat}</div><h1>${p.name}</h1><div class=pr>${price(p)}</div>
${p.colors.length?`<div class=lbl>Colour: <span id=cl>${st.color}</span></div><div>${p.colors.map((c,i)=>`<button class="opt col ${i?'':'on'}" data-c="${c[0]}" data-i=${c[1]}><span class=dot style="background:${sw(c[0])};vertical-align:-1px"></span>${c[0]}</button>`).join('')}</div>`:''}
${p.sizes.length?`<div class=lbl>Size</div><div>${p.sizes.map(s=>`<button class="opt sz" data-s=${s}>${s}</button>`).join('')}</div><div style="font-size:11px;color:#958a7e">Unsure of your size? DM us and we'll help.</div>`:''}
<p class=d>${p.desc}</p><button class="btn o" id=addb>Add to bag</button><a class=btn style="width:100%;text-align:center;margin-top:10px" href="${p.ig}" target=_blank>View on Instagram</a>
<div class=det><div>Price: ${price(p)}${p.price?'':', confirmed by DM'}</div><div>Worldwide delivery</div><div>Order by Instagram DM or email</div></div></div>`;
const sel=i=>{st.img=i;main.src=p.imgs[i];document.querySelectorAll('.th img').forEach(t=>t.classList.toggle('on',t.dataset.i==i))};sel(0);
document.querySelectorAll('.th img').forEach(t=>t.onclick=()=>sel(+t.dataset.i));
document.querySelectorAll('.col').forEach(b=>b.onclick=()=>{document.querySelectorAll('.col').forEach(x=>x.classList.remove('on'));b.classList.add('on');st.color=b.dataset.c;cl.textContent=st.color;if(+b.dataset.i<p.imgs.length)sel(+b.dataset.i)});
document.querySelectorAll('.sz').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sz').forEach(x=>x.classList.remove('on'));b.classList.add('on');st.size=b.dataset.s});
z.onmousemove=e=>{const r=z.getBoundingClientRect();main.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;main.style.transform='scale(2)'};z.onmouseleave=()=>main.style.transform='';
addb.onclick=()=>{if(p.sizes.length&&!st.size){addb.textContent='Please choose a size';setTimeout(()=>addb.textContent='Add to bag',1500);return}add({id:p.id,color:st.color,size:st.size,img:st.img})};
g.innerHTML=PRODUCTS.filter(x=>x.cat==p.cat&&x!=p).concat(PRODUCTS.filter(x=>x.cat!=p.cat)).slice(0,4).map(card).join('');reveal()</script></body></html>
